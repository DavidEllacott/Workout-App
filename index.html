<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bodyweight First</title>
<meta name="theme-color" content="#17191c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BW First">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/*
VOICE: a coach's clipboard at the gym — short, direct, nothing to read twice.
IDEA: a training card: each superset is a card, each set a line you tick with chalky fingers.
PICTURE: a moving chalk figure for every exercise, drawn on a dark slate.
COLOUR and TYPE: slate ground, chalk white, one coral accent for "done" and the rest timer; system type, big numbers.
LAYOUT: one column, 44px+ targets, sticky tab bar, rest timer above it.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ec,#17191c);--card:light-dark(#ffffff,#22252a);--card2:light-dark(#ebe8e1,#2b2f35);
--ink:light-dark(#1b1d20,#f1efe9);--mute:light-dark(#6a6a66,#9ea3a8);--line:light-dark(#dcd8cf,#363a41);
--acc:#ff5a3c;--acc2:light-dark(#c73a1f,#ff8a70);--ok:light-dark(#1d7a55,#4fd19a);
--fig:light-dark(#1b1d20,#f4f1ea);--eq:light-dark(#8d877b,#7d848c);--eqf:light-dark(#e2ddd2,#30343a);--slate:light-dark(#f8f6f1,#1c1f23)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px}
h1{font-size:20px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em;flex:1}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
h2{font-size:24px;line-height:1.1;margin:22px 0 10px;font-weight:800}
h3{font-size:17px;margin:18px 0 8px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 0 4px}
.chip{min-height:48px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;line-height:1.15}
.chip b{display:block;font-size:15px}.chip span{font-size:12px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true] span{color:inherit;opacity:.75}
.weekbar{display:flex;align-items:center;gap:8px;margin:10px 0 2px;color:var(--mute);font-size:14px}
.weekbar b{color:var(--ink);font-size:16px}
.weekbar .sp{flex:1}
.mini{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.daynote{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.block{margin:18px 0 6px}
.blockh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);margin:0 2px 6px}
.blockh b{font-size:15px;color:var(--ink)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.exhead{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.figbtn{padding:0;border:0;background:var(--slate);border-radius:12px;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line)}
svg.fig{display:block;width:100%;height:100%}
.cat{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.ss{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:800;font-size:12px}
.exname{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 0;font-weight:750;font-size:17px;line-height:1.2;min-height:44px}
.exname .lv{display:block;font-size:12px;font-weight:500;color:var(--acc2)}
.tgt{font-size:14px;color:var(--mute)}
.tgt b{color:var(--ink)}
.hint{display:inline-block;margin-top:4px;font-size:12px;font-weight:650;color:var(--ok)}
details.note{margin:8px 0 0;font-size:14px;color:var(--mute)}
details.note summary{cursor:pointer;min-height:32px;display:flex;align-items:center;color:var(--ink);font-weight:600;font-size:13px}
.sets{margin-top:8px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:24px 44px minmax(52px,1fr) 44px minmax(48px,64px) 52px;gap:6px;align-items:center}
.set.sec{grid-template-columns:24px 44px minmax(52px,1fr) 44px 44px 52px}
.sn{font-size:13px;color:var(--mute);text-align:center;font-weight:700}
.step{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:22px;line-height:1}
.val,.kg{height:44px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kg{font-size:15px;font-weight:600}
.val::placeholder{color:var(--mute);font-weight:500;opacity:.7}
.chk{height:44px;border-radius:10px;border:2px solid var(--line);background:none;font-weight:800;font-size:20px}
.set.done .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.set.done .val{border-color:var(--acc)}
.hold{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:700}
.hold.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.exfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{color:var(--ink);min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:650;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.wide{width:100%;justify-content:center;font-size:16px}
.btn.ghost{background:none}
.btn.dis{opacity:.45;pointer-events:none}
.warm{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:14px}
.warm summary{padding:12px;display:flex;justify-content:space-between;align-items:center;min-height:52px;font-weight:700;cursor:pointer}
.warm summary span{font-weight:500;color:var(--mute);font-size:14px}
.wrow{display:grid;grid-template-columns:72px minmax(0,1fr) 52px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.wrow .figbtn{aspect-ratio:4/3}
.wrow .nm{font-weight:650;font-size:15px;line-height:1.2}
.wrow .nm small{display:block;color:var(--mute);font-weight:500}
.wrow.done .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.finish{margin:18px 0 8px;display:grid;gap:8px}
.lib h3{display:flex;justify-content:space-between;align-items:baseline}
.lib h3 span{font-size:13px;color:var(--mute);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0;text-align:left;overflow:hidden}
.tile .figbtn{border:0;border-radius:0;width:100%;pointer-events:none}
.tile div{padding:8px 10px 10px;font-size:14px;font-weight:650;line-height:1.2}
.tile small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-bottom:2px}
.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sess header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sess h4{margin:0;font-size:16px}
.sess h4 small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.sess ul{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.sess li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--line)}
.sess li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}
.empty{padding:28px 16px;text-align:center;color:var(--mute);background:var(--card);border-radius:14px;border:1px dashed var(--line)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.chart select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px}
.chart .cv{position:relative;height:170px;margin-top:10px}
.chart .cv svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.form{display:grid;gap:10px}
.field{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.field input,.field select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:600}
.toggle input{width:26px;height:26px;accent-color:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mute);font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;min-height:60px;display:grid;place-items:center;gap:2px;font-size:12px;color:var(--mute);padding:6px 0}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current=page] svg{stroke:var(--acc)}
#rest{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom));z-index:7;display:none}
#rest.on{display:block}
#rest .wrap{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px 16px 0 0;padding:10px 12px;position:relative;overflow:hidden}
#rest .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--acc)}
#rest .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
#rest .l{flex:1;font-size:13px;line-height:1.25;opacity:.85}
#rest button{min-width:48px;min-height:44px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);background:none;color:var(--bg);font-weight:700}
#rest.go .wrap{background:var(--acc);color:#fff}
#rest.go button{color:#fff}
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .wrap{padding-top:8px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
.shead{display:flex;align-items:flex-start;gap:10px;margin:6px 0 10px}
.shead h2{margin:4px 0 0;flex:1;font-size:22px}
.shead h2 small{display:block;font-size:13px;color:var(--mute);font-weight:500;margin-bottom:2px}
.bigfig{background:var(--slate);border:1px solid var(--line);border-radius:16px;aspect-ratio:4/3;overflow:hidden}
.phase{font-size:12px;color:var(--mute);text-align:center;margin:6px 0 0}
ol.cues{padding-left:22px;margin:12px 0}
ol.cues li{margin:6px 0}
.vid{display:flex;gap:10px;align-items:center;margin:10px 0}
.lvl{display:grid;gap:8px}
.lvl button{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px}
.lvl button[aria-pressed=true]{border:2px solid var(--acc)}
.lvl .figbtn{pointer-events:none}
.lvl b{display:block;font-size:15px;line-height:1.2}.lvl small{color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:650;transition:transform .25s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.install{background:var(--card2);border-radius:14px;padding:12px;font-size:14px;margin-top:12px;display:flex;gap:10px;align-items:flex-start}
.install p{margin:0;flex:1}
.muted{color:var(--mute);font-size:13px}
.danger{color:var(--acc2)}
textarea{width:100%;min-height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:8px}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
@media (max-width:380px){.exhead{grid-template-columns:80px minmax(0,1fr)}.set{grid-template-columns:20px 40px minmax(44px,1fr) 40px minmax(44px,56px) 48px;gap:5px}.set.sec{grid-template-columns:20px 40px minmax(44px,1fr) 40px 42px 48px}.step{font-size:20px}}
.draw{margin:14px 0 4px}
.dframes{display:grid;background:#fff;border-radius:16px;border:1px solid var(--line);padding:10px;justify-items:center}
.dframes img{grid-area:1/1;width:100%;max-height:300px;object-fit:contain}
.dframes .b2{animation:flip 2.4s steps(1,end) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.draw figcaption{font-size:12px;color:var(--mute);margin-top:6px}.draw a{color:inherit}
:root[data-theme=dark] .dframes{filter:invert(.9);border-color:#ccc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .dframes{filter:invert(.9);border-color:#ccc}}
@media (prefers-reduced-motion:reduce){.dframes{grid-template-columns:1fr 1fr;gap:8px}.dframes img{grid-area:auto}.dframes .b2{animation:none}}
/* figures */
:root{--fig2:light-dark(#9c968b,#7b8188);--eqhi:light-dark(#fff,#454a52)}
.fig .fl{stroke:var(--eq);stroke-width:1.2}
.fig .flr{fill:var(--eqf);opacity:.55}
.fig .eq{stroke:var(--eq);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .eq.strap{stroke-width:1.4}
.fig .eq.ring{stroke-width:1.8}
.fig .eq.post{stroke-width:1.6;opacity:.6}
.fig .eqf{fill:var(--eqf);stroke:var(--eq);stroke-width:1.2}
.fig .eqhi{stroke:var(--eqhi);stroke-width:1}
.fig .eqs{fill:var(--eq)}
.fig .bn{fill:var(--fig);stroke:var(--slate);stroke-width:.9;stroke-linejoin:round}
.fig .bf{fill:var(--fig2)}
.fig .nose{stroke:none}
.fig .gh{fill:var(--fig);opacity:.16}
.fig .shd{fill:#000}
.fig .trc{stroke:var(--acc);stroke-width:1.3;fill:none;stroke-dasharray:2.5 2.5;stroke-linecap:round;opacity:.9}
.fig .arw{fill:var(--acc)}
.fig .phl{fill:var(--acc);font-weight:800;font-family:system-ui,sans-serif}
.fig .band{stroke:var(--acc);stroke-width:2;fill:none}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 id="ttl">Bodyweight First<small id="sub">12-week plan</small></h1>
  <button class="icon" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<main class="wrap" id="view"></main>
<div id="rest" role="timer" aria-live="polite"><div class="wrap"><div class="t" id="restT">0:00</div><div class="l" id="restL">Rest</div><button id="restM" aria-label="15 seconds less">−15</button><button id="restP" aria-label="15 seconds more">+15</button><button id="restX" aria-label="Stop timer">✕</button><div class="bar" id="restB"></div></div></div>
<nav class="tabs"><div class="wrap">
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
  <button data-tab="lib"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v7M8 22l4-8 4 8M6 11l6-2 6 2"/></svg>Exercises</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>History</button>
  <button data-tab="daily"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/></svg>Daily</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<script>
{
/* ======================= DATA (from the spreadsheet) ======================= */
const CATS={
 vpull:{n:'Vertical pull',ex:['negpull','lapull','ringdc','pullup','chinup','widepull','c2b']},
 hpull:{n:'Horizontal pull',ex:['bkrow_n','bkrow_v','invrow','ferow','barrow']},
 hpush:{n:'Horizontal push',ex:['kneepu','pushup','deeppu','decdeep','ringpu','rtopu','decring']},
 dip:{n:'Dip progression',ex:['barhold','ringhold','pbdip','laringdip','bardip','ringdip','rtodip']},
 quad:{n:'Quad compound',ex:['atgsq','atgsplit','rlsdss','atgdss']},
 ham:{n:'Hamstrings',ex:['boxcurl','disccurl','ringcurl','harop']},
 quadacc:{n:'Quad accessory',ex:['wallsissy','sissy']},
 warm:{n:'Rapid warm-up',ex:['circ1','circ2','angels','pullap','bandy','bander']}
};
const YT='https://youtu.be/';
const EX={
 negpull:{n:'Negative Pull-ups',u:YT+'BSaC9lCAYyg',c:['Stand on a box or jump to put your chin above the bar.','Hold the top position for a moment.','Lower your body slowly until your arms are straight. Try for approximately 30 s.','Step or jump up again for the next rep. Do not pull up.']},
 lapull:{n:'Leg-assisted Ring Pull-ups',u:YT+'xZTntHbsenM',c:['Set the rings at approximately head height.','Sit below the rings. Put your heels on the floor in front of you.','Pull your chest up to the rings. Use your legs only as much as necessary.','Lower with control until your arms are straight.']},
 ringdc:{n:'Ring DC Pull-ups',u:YT+'nFRRuAf2XMo',c:['This is a ring pull-up variation. Watch the video for the grip and the set-up.','Start from a hang with straight arms.','Pull until your chin is above the rings.','Lower with control until your arms are straight.']},
 pullup:{n:'Pull-ups (Bar or Rings)',u:YT+'L2nrtKBqk74',c:['Hang from the bar or the rings with straight arms.','Pull your shoulder blades down and back.','Pull until your chin is above the bar.','Lower with control until your arms are straight.']},
 chinup:{n:'Bar Chin-ups',u:YT+'L2nrtKBqk74',c:['Hold the bar at shoulder width. Your palms point toward you.','Hang with straight arms.','Pull until your chin is above the bar. Keep your elbows forward.','Lower with control until your arms are straight.']},
 widepull:{n:'Wide-Grip Pull-ups',u:YT+'LZHW9QyjVWA',view:'Front view',c:['Hold the bar with your hands wider than your shoulders.','Hang with straight arms.','Pull your elbows down and out until your chin is above the bar.','Lower with control until your arms are straight.']},
 c2b:{n:'Chest-to-Bar Pull-ups',u:YT+'HiJO2XPXIik',c:['Hang from the bar with straight arms.','Pull higher than a usual pull-up.','Lean back a little and touch your chest to the bar.','Lower with control until your arms are straight.']},
 bkrow_n:{n:'Bent-Knee Ring Rows (nipple height)',u:YT+'eTa3P0BiE2E',c:['Set the rings at nipple height.','Bend your knees. Keep your feet flat on the floor.','Keep your body straight from your shoulders to your knees.','Pull the rings to your chest. Lower until your arms are straight.']},
 bkrow_v:{n:'Bent-Knee Ring Rows (navel height)',u:YT+'mBcjhgbqTOw',c:['Set the rings at navel height. Your body is more horizontal, so the row is harder.','Bend your knees. Keep your feet flat on the floor.','Keep your body straight from your shoulders to your knees.','Pull the rings to your chest. Lower until your arms are straight.']},
 invrow:{n:'Inverted Ring Rows (navel height)',u:YT+'lcVeuyN0ru8',c:['Set the rings at navel height.','Keep your legs straight. Put your heels on the floor.','Keep a straight line from your heels to your head.','Pull the rings to your lower chest. Lower until your arms are straight.']},
 ferow:{n:'Feet Elevated Ring Rows (navel height)',u:YT+'Wx137VCxG8s',c:['Set the rings at navel height.','Put your heels on a box or a bench.','Keep a straight line from your heels to your head.','Pull the rings to your chest. Lower until your arms are straight.']},
 barrow:{n:'Bar Inverted Rows (parallel or straight bars)',u:'',c:['Use a low bar or parallel bars at approximately navel height.','Keep your legs straight. Put your heels on the floor.','Keep a straight line from your heels to your head.','Pull your chest to the bar. Lower until your arms are straight.']},
 kneepu:{n:'Knee Push-ups',u:YT+'1yH78fj9cSU',c:['Put your hands on the floor below your shoulders.','Put your knees on the floor.','Keep a straight line from your knees to your head.','Lower your chest near the floor. Push up until your arms are straight.']},
 pushup:{n:'Push-ups',u:YT+'ZkMKkIkFLXk',c:['Put your hands on the floor below your shoulders.','Keep a straight line from your heels to your head.','Keep your elbows at approximately 45° from your body.','Lower your chest near the floor. Push up until your arms are straight.']},
 deeppu:{n:'Deep Push-ups',u:YT+'2fq3c2IAAS4',c:['Put your hands on parallettes or blocks.','Keep a straight line from your heels to your head.','Lower your chest below the level of your hands.','Push up until your arms are straight.']},
 decdeep:{n:'Decline Deep Push-ups',u:YT+'w5nXITPiZPg',c:['Put your feet on a box. Put your hands on parallettes or blocks.','Keep a straight line from your heels to your head.','Lower your chest below the level of your hands.','Push up until your arms are straight.']},
 ringpu:{n:'Ring Push-ups',u:YT+'Oz33Djbh7O0',c:['Set the rings a short distance above the floor.','Hold the rings below your shoulders. Keep your body straight.','Keep the rings near your body. Do not let them move apart.','Lower your chest to the rings. Push up until your arms are straight.']},
 rtopu:{n:'Ring RTO Push-ups',u:YT+'Zh0OD2j5cQ4',c:['RTO means "rings turned out".','Do a ring push-up.','At the top, turn the rings out. Your thumbs point away from your body.','Keep your arms straight and your body straight.']},
 decring:{n:'Decline Ring Push-ups',u:YT+'mjnRmaxy-Z4',c:['Set the rings a short distance above the floor.','Put your feet on a box.','Keep the rings near your body.','Lower your chest to the rings. Push up until your arms are straight.']},
 barhold:{n:'Bar Dip Support Hold',u:YT+'seR0LEnt2hw',sec:1,tg:'30-40',c:['Hold the parallel bars. Push up until your arms are straight.','Push your shoulders down, away from your ears.','Keep your body still.','Hold for 30–40 s.']},
 ringhold:{n:'Ring Dip Support Hold',u:YT+'8f2gnWGShD4',sec:1,tg:'30-40',c:['Hold the rings. Push up until your arms are straight.','Keep the rings near your body.','Push your shoulders down, away from your ears.','Hold for 30–40 s.']},
 pbdip:{n:'Parallel Bar Leg-Assisted Dips (can be done on 2 chairs)',u:'https://youtube.com/shorts/21NdXfFRcJo',c:['Use parallel bars or two strong chairs.','Keep your feet on the floor. Use your legs to help.','Lower until your shoulders are a little below your elbows.','Push up until your arms are straight.']},
 laringdip:{n:'Leg-assisted Ring Dips',u:YT+'8f0mAStMc1k',c:['Set the rings at approximately hip height.','Keep your feet on the floor. Use your legs to help.','Keep the rings near your body.','Lower until your shoulders are a little below your elbows. Push up.']},
 bardip:{n:'Bar Dips',u:YT+'cuBhK7t9eTY',c:['Start at the top with straight arms.','Lean forward a little.','Lower until your shoulders are below your elbows.','Push up until your arms are straight.']},
 ringdip:{n:'Ring Dips',u:YT+'nnYGChlKJTs',c:['Start at the top with straight arms.','Keep the rings near your body. Do not let them move apart.','Lower until your shoulders are below your elbows.','Push up until your arms are straight.']},
 rtodip:{n:'RTO Ring Dips',u:YT+'pTM-cfQ3EI8',c:['RTO means "rings turned out".','Do a ring dip.','At the top, turn the rings out. Your thumbs point away from your body.','Keep the rings near your body.']},
 atgsq:{n:'Bodyweight ATG Squat',u:YT+'uahy6WFwU8w',c:['Stand with your feet approximately shoulder width apart.','Go down as deep as possible. Your hamstrings touch your calves.','Keep your heels on the floor.','Push up until you stand straight.']},
 atgsplit:{n:'ATG Split Squats',u:YT+'onII3j3lmaM',c:['Make a long step. Keep the front foot flat.','Move your front knee forward over your toes as far as possible.','Lower until your rear knee is near the floor.','Push up through your front foot. Do all reps, then change legs.']},
 rlsdss:{n:'Rear Leg Supported Deficit Split Squat',u:YT+'r067nHNPlzo',c:['Put your front foot on a low step or plate.','Hold a support for balance. Watch the video for the rear-leg set-up.','Move your front knee forward over your toes and lower your body.','Push up through your front foot. Do all reps, then change legs.']},
 atgdss:{n:'ATG Deficit Split Squat',u:YT+'Br1SJbEBVTY',c:['Put your front foot on a step or plate.','Move your front knee forward over your toes as far as possible.','Lower until your hamstring touches your calf.','Push up through your front foot. Do all reps, then change legs.']},
 boxcurl:{n:'Box Leg Curls',u:'https://youtube.com/shorts/gR4UGzmVG2Y',c:['Lie on your back. Put your heels on a box.','Push your heels down into the box and lift your hips.','Pull with your heels to lift your hips higher.','Lower with control. Watch the video for the exact set-up.']},
 disccurl:{n:'Sliding Disc Leg Curls',u:YT+'SQVNaEj71Vo',c:['Lie on your back. Put your heels on sliding discs or a towel.','Lift your hips. Keep them up during the set.','Pull your heels toward your hips.','Slide your heels out slowly until your legs are straight.']},
 ringcurl:{n:'Ring Leg Curls',u:YT+'ZWaLdZNUbUw',c:['Set the rings a short distance above the floor.','Lie on your back. Put your heels in the rings.','Lift your hips and pull your heels toward your hips.','Extend your legs slowly. Keep your hips up.']},
 harop:{n:'Harop Curls',u:YT+'6BqCo-Aztp4',c:['Kneel on a pad. Anchor your ankles below a strong object.','Start folded forward from the hips.','Pull your heels against the anchor and squeeze your glutes.','Come up to a straight kneeling position. Then fold back slowly.']},
 wallsissy:{n:'Wall-assisted Sissy Squats',u:YT+'cW9XfUEQ9pw',c:['Hold a wall or a post with one hand.','Lift your heels.','Move your knees forward and lean back. Keep a straight line from your knees to your head.','Push your knees back to stand.']},
 sissy:{n:'Sissy Squats',u:YT+'RPEsz3ZdY_w',c:['Stand with your feet hip width apart. Lift your heels.','Move your knees forward and lean back.','Keep a straight line from your knees to your head.','Push your knees back to stand.']},
 circ1:{n:'Slow Arm Circles (one way)',u:'https://www.youtube.com/shorts/lzR7tzI1JUI',w:'25',c:['Stand straight. Keep your arms straight.','Make large, slow circles.','Do 25 circles.']},
 circ2:{n:'Slow Arm Circles (opposite way)',u:'https://www.youtube.com/shorts/lzR7tzI1JUI',w:'25',c:['Do the circles in the opposite direction.','Keep your arms straight.','Do 25 circles.']},
 angels:{n:'Prone Snow Angels',u:'https://www.youtube.com/watch?v=vSou6Vup5W8',w:'15',view:'Seen from above',c:['Lie face down. Lift your arms a little from the floor.','Move your arms in a large arc, from above your head to your hips.','Keep your arms off the floor.','Do 15 reps.']},
 pullap:{n:'Banded Pullaparts',u:'https://www.youtube.com/watch?v=MnDpmNYUjbc',w:'15',view:'Front view',c:['Hold a band in front of your chest. Keep your arms straight.','Pull the band apart until it touches your chest.','Squeeze your shoulder blades. Return slowly.','Do 15 reps.']},
 bandy:{n:'Banded Ys',u:'https://www.youtube.com/watch?v=KX7_iDOWlGs',w:'15',view:'Front view',c:['Hold a band with your hands in front of your hips.','Lift your arms up and out to make a Y.','Keep the band tight. Return slowly.','Do 15 reps.']},
 bander:{n:'Band External Rotations',u:'https://www.youtube.com/watch?v=dLSytuFOCX8',w:'12/side',view:'Front view',c:['Attach the band at elbow height, at your side.','Keep your elbow against your body, bent at 90°.','Turn your forearm out. Return slowly.','Do 12 reps on each side.']}

const PHX={negpull:['Lower slowly','Step up'],barhold:['Hold','Hold'],ringhold:['Hold','Hold'],harop:['Come up','Fold back'],angels:['To hips','Overhead'],pullap:['Pull apart','Return'],bandy:['Raise','Lower'],bander:['Rotate out','Return'],atgsq:['Down','Up']};
const TRX={harop:'head',circ1:'w1',circ2:'w1',angels:'wR',pullap:'wR',bandy:'wR',bander:'wR',widepull:'head',barhold:null,ringhold:null};
function jointsOf(spec,p){return spec.v==='f'?frontJ(p):sideJ(p);}
function bodyOf(spec,J,g){return spec.v==='f'?frontDraw(J,spec,g):sideDraw(J,g);}
const VBC={};
function fit(svg,id){if(VBC[id]){svg.setAttribute('viewBox',VBC[id]);return;}const spec=FIG[id],g=svg.children[1];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const k of spec.k){g.innerHTML=bodyOf(spec,jointsOf(spec,k),true);let b;try{b=g.getBBox();}catch(e){return;}if(!b.width)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);}
 for(const e of spec.eq||[]){if(e.t==='box'){x0=Math.min(x0,e.x+e.w*.4);x1=Math.max(x1,e.x+e.w*.6);}if(e.t==='pole'||e.t==='lbar'){x0=Math.min(x0,e.x-5);x1=Math.max(x1,e.x+5);}}
 x0-=9;x1+=9;y0-=13;y1=FY+6;let w=x1-x0,h=y1-y0;if(w<120){x0-=(120-w)/2;w=120;}
 if(w/h<4/3){const nw=h*4/3;x0-=(nw-w)/2;w=nw;}else{h=w*.75;y0=y1-h;}
 VBC[id]=[x0,y0,w,h].map(f1).join(' ');svg.setAttribute('viewBox',VBC[id]);}
function trace(spec){const key=spec.tr;if(!key||spec.loop&&spec.v==='f')return'';const pts=[];const n=28;
 for(let i=0;i<=n;i++){const p=spec.loop?chainAt(spec.k,i/n*.94):chainAt(spec.k,i/n);pts.push(add(jointsOf(spec,p)[key],spec.to||[0,0]));}
 if(len(sub(pts[n],pts[0]))<4&&!spec.loop)return'';
 const a=pts[n],b=pts[n-2],d=nrm(sub(a,b)),nn=rot(d),tip=add(a,mul(d,2.5));
 return`<polyline class="trc" points="${pts.map(P2).join(' ')}"/><path class="arw" d="M${P2(tip)}L${P2(add(sub(a,mul(d,4)),mul(nn,3.2)))}L${P2(sub(sub(a,mul(d,4)),mul(nn,3.2)))}Z"/>`;}
function drawFig(svg,ms){const id=svg.dataset.ex,spec=FIG[id];if(!spec)return;
 if(!svg.dataset.fit){fit(svg,id);if(VBC[id])svg.dataset.fit=1;else return;}
 const big=svg.dataset.big==='1';
 if(big&&!svg.dataset.st){svg.dataset.st=1;const k=spec.k;let extra='';if(!spec.loop)extra+=bodyOf(spec,jointsOf(spec,k[k.length-1]),true);svg.firstChild.insertAdjacentHTML('beforeend',extra);svg.children[2].innerHTML=trace(spec);}
 const r=ms==null?{p:spec.k[+(svg.dataset.ph||0)?spec.k.length-1:0],ph:+(svg.dataset.ph||0)}:poseAt(spec,ms+(+svg.dataset.off||0));
 const J=jointsOf(spec,r.p);let s=shadow(J,spec.v==='f')+eqDyn(spec,J)+bodyOf(spec,J,false);
 if(big&&spec.ph&&r.ph>=0){const vb=VBC[id].split(' ').map(Number),fs=f1(vb[2]*.052);s+=`<text class="phl" x="${f1(vb[0]+vb[2]*.04)}" y="${f1(vb[1]+fs*1.5)}" style="font-size:${fs}px">${esc(spec.ph[r.ph])}</text>`;}
 svg.children[1].innerHTML=s;}
const figHTML=(id,off=0,big=0)=>`<svg class="fig" viewBox="0 0 200 150" data-ex="${id}" data-off="${off}"${big?' data-big="1"':''} aria-hidden="true"><g>${eqSVG(FIG[id].eq)}</g><g></g><g></g></svg>`;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');

function loop(now){if(!reduce.matches&&!document.hidden){for(const s of visible){if(!s.isConnected){visible.delete(s);continue;}drawFig(s,now-t0);}}requestAnimationFrame(loop);}

const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDate=iso=>{const d=new Date(iso+(iso.length===10?'T12:00':''));return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});};
const range=r=>{const m=String(r).split('-').map(Number);return{lo:m[0],hi:m[1]||m[0]};};

function programStart(){if(S.set.start)return S.set.start;const f=S.ses.length?S.ses[S.ses.length-1].date:null;let min=f;for(const s of S.ses)if(!min||s.date<min)min=s.date;return min||todayISO();}
function weekNow(){const st=new Date(programStart()+'T12:00'),n=new Date(todayISO()+'T12:00');return Math.min(WEEKS,Math.max(1,Math.floor((n-st)/864e5/7)+1));}
function nextDay(){const done=S.ses.slice().sort((a,b)=>a.end-b.end);if(!done.length)return'd1';const i=PROG.findIndex(d=>d.id===done[done.length-1].day);return PROG[(i+1)%PROG.length].id;}
function lastFor(ex,excludeId){let best=null;for(const s of S.ses){if(s.id===excludeId)continue;for(const it of s.items)if(it.ex===ex&&it.sets.some(x=>x.done)&&(!best||s.end>best.s.end))best={s,it};}return best;}
const fmtSets=(sets,sec)=>sets.filter(x=>x.done).map(x=>(x.v??'–')+(sec?'s':'')+(x.kg?'+'+x.kg:'')).join(' · ');

let R=null,rInt=null;

 if(left===0&&!R.fired){R.fired=true;$('#rest').className='on go';$('#restL').textContent='Rest done. '+R.label.replace(/^Rest[^.]*\.\s*/,'');beep();vib([250,120,250]);setTimeout(()=>{if(R&&R.fired)stopRest();},6000);}}

function card(d,i){
 const sl=d.s[i],it=itemAt(i),ex=EX[it.ex],sec=!!ex.sec,tg=sec?ex.tg:sl.r,rg=range(tg);

function drawChart(){

  const pts=S.ses.slice().sort((a,b)=>a.end-b.end).map(s=>{const it=s.items.find(i=>i.ex===chartEx&&i.sets.some(x=>x.done));if(!it)return null;const v=it.sets.filter(x=>x.done).map(x=>+x.v||0);return{d:s.date,best:Math.max(...v),tot:v.reduce((a,b)=>a+b,0)};}).filter(Boolean);
  if(!pts.length){svg.innerHTML='';return;}
  const pad={l:30,r:10,t:10,b:22},mx=Math.max(...pts.map(p=>p.tot))*1.1||1,n=pts.length;
  const X=i=>pad.l+(n===1?(W-pad.l-pad.r)/2:i*(W-pad.l-pad.r)/(n-1)),Y=v=>H-pad.b-(v/mx)*(H-pad.t-pad.b);
  let s='';for(const g of [0,.5,1]){const v=Math.round(mx*g);s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${v}</text>`;}
  const path=k=>pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1)).join(' ');
  s+=`<path d="${path('tot')}" fill="none" stroke="var(--mute)" stroke-width="2"/><path d="${path('best')}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(p.best)}" r="3.5" fill="var(--acc)"/>`;});
  const step=Math.max(1,Math.ceil(n/(W<520?4:7)));pts.forEach((p,i)=>{if(i%step===0||i===n-1)s+=`<text x="${X(i)}" y="${H-5}" text-anchor="middle" font-size="11" fill="var(--mute)">${esc(p.d.slice(5).replace('-','/'))}</text>`;});

 h+=`<div class="row2"><label class="field">Body weight (${S.set.unit})<input type="number" inputmode="decimal" step="0.1" data-dy="weight" value="${e.weight??''}"></label><label class="field">Steps<input type="number" inputmode="numeric" data-dy="steps" value="${e.steps??''}"></label></div></div>`;
 const days=[];for(let i=0;i<28;i++){const d=new Date();d.setDate(d.getDate()-i);const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');days.push(iso);}
 const avg=(arr,k)=>{const v=arr.map(d=>+(S.daily[d]||{})[k]).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
 const w7=avg(days.slice(0,7),'weight'),w7p=avg(days.slice(7,14),'weight'),s7=avg(days.slice(0,7),'steps');
 h+=`<div class="stats"><div class="stat"><span>7-day avg weight</span><b>${w7?w7.toFixed(1):'–'}</b><span>${w7&&w7p?(w7-w7p>=0?'+':'')+(w7-w7p).toFixed(1)+' vs previous 7 days':S.set.unit}</span></div><div class="stat"><span>7-day avg steps</span><b>${s7?Math.round(s7).toLocaleString():'–'}</b><span>steps per day</span></div></div>`;
 h+=`<h3>Last 28 days</h3><table><thead><tr><th>Date</th><th>Train</th><th>Diet</th><th class="n">Weight</th><th class="n">Steps</th></tr></thead><tbody>`+days.map(d=>{const x=S.daily[d]||{},tr=x.train||S.ses.some(s=>s.date===d);return`<tr><td>${esc(fmtDate(d))}</td><td>${tr?'✓':''}</td><td>${x.diet?'✓':''}</td><td class="n">${x.weight??''}</td><td class="n">${x.steps!=null&&x.steps!==''?Number(x.steps).toLocaleString():''}</td></tr>`;}).join('')+`</tbody></table>`;
 return h;
}

/* ======================= SHEETS ======================= */
function openSheet(html){$('#sheetBody').innerHTML=html;$('#scrim').classList.add('on');$('#sheet').classList.add('on');$('#sheet').scrollTop=0;hookFigs($('#sheetBody'));}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');setTimeout(()=>{if(!$('#sheet').classList.contains('on'))$('#sheetBody').innerHTML='';},300);}
$('#scrim').onclick=closeSheet;
function sheetHead(title,small){return`<div class="shead"><h2><small>${esc(small||'')}</small>${esc(title)}</h2><button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;}
function openEx(id){const ex=EX[id],c=CATS[ex.cat],i=c.ex.indexOf(id);
 let h=sheetHead(ex.n,ex.cat==='warm'?'Warm-up · '+ex.w+' reps':c.n+' · Level '+(i+1)+' of '+c.ex.length);
 h+=`<div class="bigfig">${figHTML(id,0,1)}</div><p class="phase">${esc(ex.view||'Side view')}${reduce.matches?' · tap the figure to see the other position':' · faint shape = end position · dashed line = movement path'}</p>`;
 if(DRAW[id]){const dr=DRAW[id],im=DIMG[dr.i];h+=`<figure class="draw"><div class="dframes"><img src="${im[0]}" alt="Drawing of ${esc(ex.n)}, first position"><img class="b2" src="${im[1]}" alt="Drawing of ${esc(ex.n)}, second position"></div><figcaption>${dr.c?esc(dr.c)+' ':''}Drawing: <a href="https://github.com/everkinetic/data" target="_blank" rel="noopener">Everkinetic</a> by Greg Priday, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Cropped and resized.</figcaption></figure>`;}
 h+=`<ol class="cues">${ex.c.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
 h+=`<div class="vid">${ex.u?`<a class="btn pri" href="${esc(ex.u)}" target="_blank" rel="noopener">Watch the video ↗</a><span class="muted">Needs a connection</span>`:`<span class="muted">The spreadsheet has no video for this exercise.</span>`}</div>`;
 if(ex.cat!=='warm'){h+=`<div class="exfoot">${i>0?`<button class="btn" data-open="${c.ex[i-1]}">← Easier</button>`:''}${i<c.ex.length-1?`<button class="btn" data-open="${c.ex[i+1]}">Harder →</button>`:''}</div>`;}
 openSheet(h);
}
let pickSlot=null;
function openPicker(i){const d=dayById(curDay()),sl=d.s[i],cur=exFor(sl);pickSlot=i;
 let h=sheetHead('Choose your level',d.n+' · '+CATS[sl.c].n);
 h+=`<label class="toggle" style="margin-bottom:10px">Use on all days with this exercise<input type="checkbox" id="allDays" ${d.id==='d2'?'':'checked'}></label>`;
 if(d.id==='d2')h+=`<p class="muted">Light day: choose an easier level than on the heavy days.</p>`;
 h+=`<div class="lvl">`+CATS[sl.c].ex.map((id,j)=>`<button data-lv="${id}" aria-pressed="${id===cur}"><div class="figbtn">${figHTML(id,j*250)}</div><div><small>Level ${j+1}</small><b>${esc(EX[id].n)}</b></div></button>`).join('')+`</div>`;
 openSheet(h);
}
function openSettings(){const s=S.set;
 let h=sheetHead('Settings','Bodyweight First');
 h+=`<div class="form"><label class="field">Program start date (sets the week number)<input type="date" id="stStart" value="${esc(s.start)}"></label>
 <label class="field">Week override (0 = automatic)<input type="number" id="stWeek" min="0" max="${WEEKS}" value="${s.week||0}"></label>
 <div class="row2"><label class="field">Rest A → B (s)<input type="number" id="stRe" min="0" value="${s.restEx}"></label><label class="field">Rest after superset (s)<input type="number" id="stRs" min="0" value="${s.restSs}"></label></div>
 <label class="field">Load unit<select id="stUnit"><option ${s.unit==='kg'?'selected':''}>kg</option><option ${s.unit==='lb'?'selected':''}>lb</option></select></label>
 <label class="toggle">Sound at end of rest<input type="checkbox" id="stSound" ${s.sound?'checked':''}></label>
 <label class="toggle">Vibrate at end of rest (Android)<input type="checkbox" id="stVib" ${s.vib?'checked':''}></label>
 <label class="toggle">Keep screen on during a workout<input type="checkbox" id="stWake" ${s.wake?'checked':''}></label></div>
 <p class="muted">Plan rules: rest 30–60 s between exercises, 90 s between supersets. Train 3 days each week, with at least one rest day between.</p>
 <h3>Backup</h3><p class="muted">Your data stays on this phone only. Export a backup from time to time.</p>
 <div class="exfoot"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button><button class="btn" data-act="csv">Export sets (CSV)</button><button class="btn" data-act="copy">Copy backup text</button></div>
 <h3>Credits</h3><p class="muted">Exercise drawings for 8 exercises: <a href="https://github.com/everkinetic/data" target="_blank" rel="noopener" style="color:inherit">Everkinetic</a> by Greg Priday, licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener" style="color:inherit">CC BY-SA 4.0</a>. Changes: cropped, resized, colours inverted in dark mode. The changed drawings are shared under the same licence. Moving figures and plan text: made for this app from your spreadsheet.</p>
 <h3>Reset</h3><div class="exfoot"><button class="btn danger" data-act="reset">Delete all data</button></div>
 <p class="muted">${memOnly?'Storage is not available here.':'Saved on this device.'} ${S.ses.length} workouts.</p>`;
 openSheet(h);
 const bind=(id,k,fn)=>{$(id).onchange=e=>{S.set[k]=fn(e.target);save();render();};};
 bind('#stStart','start',t=>t.value);bind('#stWeek','week',t=>Math.max(0,Math.min(WEEKS,+t.value||0)));
 bind('#stRe','restEx',t=>Math.max(0,+t.value||0));bind('#stRs','restSs',t=>Math.max(0,+t.value||0));
 bind('#stUnit','unit',t=>t.value);bind('#stSound','sound',t=>t.checked);bind('#stVib','vib',t=>t.checked);bind('#stWake','wake',t=>{if(!t.checked)unwake();return t.checked;});
}
function confirmBox(msg,okLabel,fn){openSheet(sheetHead(msg,'Confirm')+`<div class="finish"><button class="btn pri wide" id="cfOk">${esc(okLabel)}</button><button class="btn ghost wide" data-close>Cancel</button></div>`);$('#cfOk').onclick=()=>{closeSheet();fn();};}

/* ======================= BACKUP ======================= */
function download(name,text,type){try{const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('File saved: '+name);}catch(e){toast('Download is not possible here. Use Copy backup text.');}}
function csv(){const rows=[['date','day','week','category','exercise','set','value','unit','added_load']];for(const s of S.ses.slice().sort((a,b)=>a.end-b.end))for(const it of s.items)it.sets.forEach((x,j)=>{if(x.done)rows.push([s.date,s.day,s.week,CATS[it.cat].n,EX[it.ex].n,j+1,x.v??'',EX[it.ex].sec?'s':'reps',x.kg??'']);});return rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n');}
$('#fileIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.ses))throw 0;S=Object.assign(blank(),d);S.set=Object.assign(blank().set,d.set);S.ui=Object.assign(blank().ui,d.ui);save();closeSheet();render();toast('Backup imported');}catch(err){toast('This file is not a valid backup');}e.target.value='';};

/* ======================= EVENTS ======================= */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#setBtn').onclick=openSettings;
document.addEventListener('click',e=>{
 const fg=e.target.closest('.bigfig svg.fig');if(fg&&reduce.matches){fg.dataset.ph=fg.dataset.ph==='1'?'0':'1';drawFig(fg,null);return;}
 const t=e.target.closest('button,a');if(!t)return;
 const ds=t.dataset;
 if('close' in ds){closeSheet();return;}
 if(ds.open){openEx(ds.open);return;}
 if(ds.pick!=null){openPicker(+ds.pick);return;}
 if(ds.lv){const d=dayById(curDay()),sl=d.s[pickSlot],all=$('#allDays')&&$('#allDays').checked;
  const keys=all?PROG.flatMap(p=>p.s.filter(x=>x.c===sl.c&&!(p.id==='d2'&&d.id!=='d2')).map(x=>x.key)):[sl.key];
  keys.forEach(k=>S.ch[k]=ds.lv);
  if(S.act)S.act.items.forEach((it,i)=>{const s2=dayById(S.act.day).s[i];if(keys.includes(s2.key)&&!it.sets.some(x=>x.done))it.ex=ds.lv;});
  save();closeSheet();render();toast('Level set: '+EX[ds.lv].n);return;}
 if(ds.day){if(S.act&&S.act.day!==ds.day){if(S.act.items.some(it=>it.sets.some(x=>x.done))||S.act.warm.length){confirmBox('Discard the workout in progress?','Discard and change day',()=>{S.act=null;S.ui.day=ds.day;unwake();save();render();});return;}S.act=null;}S.ui.day=ds.day;save();render();return;}
 if(ds.wk){const cur=S.act?S.act.week:(S.set.week||weekNow());const n=Math.max(1,Math.min(WEEKS,cur+ +ds.wk));if(S.act)S.act.week=n;else S.set.week=n;save();render();return;}
 if(ds.warm){const a=ensureAct(),i=a.warm.indexOf(ds.warm);if(i<0)a.warm.push(ds.warm);else a.warm.splice(i,1);save();render();return;}
 if(ds.del){confirmBox('Delete this workout?','Delete',()=>{S.ses=S.ses.filter(s=>s.id!==ds.del);save();render();});return;}
 const card=t.closest('.ex'),row=t.closest('.set');
 if(card&&(row||'addset' in ds||'delset' in ds)){
  const i=+card.dataset.slot,a=ensureAct(),it=a.items[i];const d=dayById(a.day),sl=d.s[i];
  if(it.ex!==exFor(sl)&&!it.sets.some(x=>x.done))it.ex=exFor(sl);
  if('addset' in ds){it.sets.push({v:null,kg:null,done:false});save();render();return;}
  if('delset' in ds){if(it.sets.length>1)it.sets.pop();save();render();return;}
  const j=+row.dataset.set,x=it.sets[j],inp=row.querySelector('.val');
  if(ds.step){const base=x.v??(+inp.placeholder||0);x.v=Math.max(0,base+ +ds.step);inp.value=x.v;save();return;}
  if('hold' in ds){if(t.classList.contains('on')){clearInterval(t._h);const s=Math.round((Date.now()-t._s)/1000);x.v=s;inp.value=s;t.classList.remove('on');t.textContent='⏱';save();}else{t._s=Date.now();t.classList.add('on');t._h=setInterval(()=>{const s=Math.floor((Date.now()-t._s)/1000);t.textContent=s+'s';inp.value=s;},250);}return;}
  if('chk' in ds){if(x.done){x.done=false;save();render();return;}
   if(x.v==null){const ph=+inp.placeholder;x.v=isNaN(ph)?0:ph;}
   x.done=true;save();render();vib(30);
   const isA=sl.ss==='A',pair=isA?i+1:i-1,next=d.s[isA?i+1:i+2];
   const rest=isA&&d.s[pair]?S.set.restEx:S.set.restSs;
   const allDone=a.items.every(q=>q.sets.every(z=>z.done));
   if(!allDone&&rest>0){let lbl;if(isA&&d.s[pair])lbl='Rest. Next: B · '+EX[a.items[pair].ex].n;else{const pend=a.items.findIndex(q=>q.sets.some(z=>!z.done));lbl='Rest. Next: '+(pend>=0?d.s[pend].ss+' · '+EX[a.items[pend].ex].n:'finish');}startRest(rest,lbl);}
   if(allDone){stopRest();toast('All sets done. Tap Finish workout.');}
   return;}
 }
 const act=ds.act;
 if(act==='finish'){const a=S.act;if(!a)return;a.end=Date.now();a.items=a.items.map(it=>({...it,sets:it.sets}));S.ses.push(a);S.daily[a.date]=Object.assign({},S.daily[a.date],{train:true});const n=a.items.reduce((s,it)=>s+it.sets.filter(x=>x.done).length,0);S.act=null;S.ui.day=nextDay();unwake();stopRest();save();render();window.scrollTo(0,0);toast('Workout saved: '+n+' sets');return;}
 if(act==='discard'){confirmBox('Discard this workout?','Discard',()=>{S.act=null;unwake();stopRest();save();render();});return;}
 if(act==='hideinst'){S.ui.hideInstall=true;save();render();return;}
 if(act==='export'){download('bodyweight-first-backup-'+todayISO()+'.json',JSON.stringify(S),'application/json');return;}
 if(act==='csv'){download('bodyweight-first-sets-'+todayISO()+'.csv',csv(),'text/csv');return;}
 if(act==='import'){$('#fileIn').click();return;}
 if(act==='copy'){const txt=JSON.stringify(S);openSheet(sheetHead('Backup text','Copy and keep it safe')+`<textarea readonly id="bkTxt">${esc(txt)}</textarea><div class="exfoot"><button class="btn pri" id="bkCopy">Copy</button><button class="btn" data-close>Close</button></div><h3>Restore from text</h3><textarea id="bkIn" placeholder="Paste backup text here"></textarea><div class="exfoot"><button class="btn" id="bkLoad">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('Copied');}catch(e){$('#bkTxt').select();toast('Select the text and copy it');}};
  $('#bkLoad').onclick=()=>{try{const d=JSON.parse($('#bkIn').value);if(!Array.isArray(d.ses))throw 0;S=Object.assign(blank(),d);S.set=Object.assign(blank().set,d.set);S.ui=Object.assign(blank().ui,d.ui);save();closeSheet();render();toast('Backup restored');}catch(e){toast('This text is not a valid backup');}};return;}
 if(act==='reset'){confirmBox('Delete all workouts, levels and check-ins?','Delete all data',()=>{S=blank();save();render();toast('All data deleted');});return;}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='chSel'){chartEx=t.value;drawChart();return;}
 if(t.dataset.dy){const k=t.dataset.dy,d=todayISO();S.daily[d]=S.daily[d]||{};S.daily[d][k]=t.type==='checkbox'?t.checked:(t.value===''?null:+t.value);save();if(t.type==='checkbox')render();return;}
 const row=t.closest('.set'),card=t.closest('.ex');if(!row||!card)return;
 const a=ensureAct(),it=a.items[+card.dataset.slot],x=it.sets[+row.dataset.set];
 const v=t.value===''?null:Math.max(0,+t.value);
 if(t.classList.contains('val'))x.v=v;else if(t.classList.contains('kg'))x.kg=v;
 save();
});
document.addEventListener('change',e=>{if(e.target.dataset.dy&&e.target.type!=='checkbox')render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ======================= START ======================= */
if(S.act&&S.act.date!==todayISO()&&!S.act.items.some(it=>it.sets.some(x=>x.done)))S.act=null;
if(S.act)wake();
setTab(S.ui.tab||'train');
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.BWF={FIG,EX,CATS,figHTML,drawFig,poseAt,hookFigs};
}
</script>
